<!doctype html>
<html>
  <head>
    <!-- Page setup -->
    <meta charset="utf-8">
    <title>epic site</title>
    <meta name="description" content="just vibes">
    <meta name="author" content="me (duh)">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
    <link rel="icon" type="image/png" href="favicon.png">
  
    <!-- Stylesheets -->
    <!-- Reset default styles and add support for Google Fonts -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css" rel="stylesheet" type="text/css" />
    <link href="http://fonts.googleapis.com/css?family=Roboto" rel="stylesheet" type="text/css" />
   
    <!-- Custom styles -->
    <link href="style.css" rel="stylesheet" type="text/css" />

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.4.min.js" integrity="sha384-oF8ZOD2zFEJJL2Gi4mJgMkQKQbXnB9DC0Tiw7OnJntn5rOhzn9jZdbZIfOsUuy2p" crossorigin="anonymous"></script>
  </head>
  
  <body>

    <header id="header">
      <img src="logo.png" alt="logo">
      <h1>epic site</h1>
      
      <ul class="main-menu">
        <li><a href="#home">home</a></li>
        <li><a href="#about">about</a></li>
        <li><a href="#contact">contact</a></li>
      </ul>                 
    </header>
   
    <div id="container">
      <div class="inner">
        <div id="content"> 
          
          <div id="home" class="content-region hide">
            <h2>Home</h2>
            <p>
              welcome to my site. it’s simple, just like me.
            </p>
          </div>
          
          <div id="about" class="content-region hide">
            <h2>About</h2>
            <p>
              this site is just a little project i’m playing with. nothing fancy.
            </p>
          </div>
          
          <div id="contact" class="content-region hide">
            <h2>Contact</h2>
            <p>
              reach out to me at <a href="mailto:me@chillmail.com">me@chillmail.com</a>.
            </p>
          </div>
          
        </div>
      </div>
    </div>

    <footer>  
      Footer region
    </footer>
    
    <!-- Load additional JS scripts here -->
    <script>
      $(document).ready(() => {
        $('.main-menu a').on('click', function(e) {
          e.preventDefault();
          $('.content-region').addClass('hide');
          const target = $(this).attr('href');
          $(target).removeClass('hide');
        });
      });
    </script>
    
    <style>
      body {
        font-family: 'Roboto', sans-serif;
        margin: 0;
        background-color: #f7f7f7;
      }
      #header {
        text-align: center;
        background: #333;
        color: #fff;
        padding: 20px;
      }
      #container {
        max-width: 600px;
        margin: 40px auto;
        padding: 20px;
        background: #fff;
        box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.1);
        border-radius: 8px;
        text-align: center;
      }
      .main-menu {
        list-style: none;
        padding: 0;
        display: flex;
        justify-content: center;
        gap: 15px;
      }
      .main-menu a {
        color: #fff;
        text-decoration: none;
      }
      .content-region {
        display: none;
      }
      .content-region:not(.hide) {
        display: block;
      }
    </style>
    
  </body>
</html>
