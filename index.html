<!doctype html>
<html>
  <head>
    <!-- Page setup -->
    <meta charset="utf-8">
    <title>epic site</title>
    <meta name="description" content="just vibes">
    <meta name="author" content="me (duh)">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
    <link rel="icon" type="image/png" href="favicon.png">
  
    <!-- Stylesheets -->
    <!-- Reset default styles and add support for google fonts -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css" rel="stylesheet" type="text/css" />
    <link href="http://fonts.googleapis.com/css?family=Roboto" rel="stylesheet" type="text/css" />
   
    <!-- Custom styles -->
    <link href="style.css" rel="stylesheet" type="text/css" />

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.4.1.min.js" integrity="sha256-CSXorXvZcTkaix6Yvo6HppcZGetbYMGWSFlBw8HfCJo=" crossorigin="anonymous"></script>    

    <style>
      /* Additional styles for the buttons */
      .button-container {
        display: flex;
        justify-content: space-around;
        margin: 20px 0;
      }
      
      .image-button {
        width: 100px;
        height: 100px;
        border: 2px solid rgba(255, 255, 255, 0.5);
        border-radius: 10px;
        background-color: transparent;
        display: flex;
        justify-content: center;
        align-items: center;
        cursor: pointer;
        transition: 0.3s ease;
      }

      .image-button:hover {
        border-color: white;
      }

      .image-button img {
        max-width: 90%;
        max-height: 90%;
        object-fit: cover;
        border-radius: 8px;
      }
    </style>
  </head>
  
  <body>

    <header id="header">
      <img src="logo.png">
      <h1>epic site</h1>
      
      <!-- Menu link fragment #id should match a div id. Example: <a href="#home"> links to <div id="home"></div>  -->
      <ul class="main-menu">
        <li><a href="#home">home</a></li>
        <li><a href="#about">about</a></li>
        <li><a href="#contact">contact</a></li>
      </ul>                 
    </header>
   
    <div id="container">
      <div class="inner">
        <div id="content"> 
          
          <div id="home" class="content-region hide">
            <h2>Home</h2>
            <p>
              welcome to my site. it’s simple, just like me.
            </p>
          </div>
          
          <div id="about" class="content-region hide">
            <h2>About</h2>
            <p>
              this site is just a little project i’m playing with. nothing fancy.
            </p>
          </div>
          
          <div id="contact" class="content-region hide">
            <h2>Contact</h2>
            <div class="button-container">
              <div class="image-button">
                <img src="image1.png" alt="Button 1">
              </div>
              <div class="image-button">
                <img src="image2.png" alt="Button 2">
              </div>
              <div class="image-button">
                <img src="image3.png" alt="Button 3">
              </div>
              <div class="image-button">
                <img src="image4.png" alt="Button 4">
              </div>
            </div>
          </div>
          
        </div>
      </div>
    </div>

    <footer>  
      Footer region
    </footer>
    
    <!-- Load additional JS scripts here -->
    <script type="text/javascript" src="script.js"></script>
    
  </body>
</html>
